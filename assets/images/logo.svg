<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g id="crown" fill="url(#goldGrad)" stroke="#AA7C11" stroke-width="1.5">
    <!-- Top Central Peak -->
    <path d="M 250,50 L 262,78 L 290,62 L 278,96 L 305,102 L 272,118 L 228,118 L 195,102 L 222,96 L 210,62 L 238,78 Z" />
    <!-- Crown Jewels / Dots -->
    <circle cx="250" cy="45" r="5" fill="url(#goldLight)" />
    <circle cx="292" cy="58" r="4.5" fill="url(#goldLight)" />
    <circle cx="208" cy="58" r="4.5" fill="url(#goldLight)" />
    <circle cx="308" cy="98" r="4" fill="url(#goldLight)" />
    <circle cx="192" cy="98" r="4" fill="url(#goldLight)" />
    <path d="M 215,114 Q 250,122 285,114" fill="none" stroke="url(#goldLight)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Central Medallion Circle -->
  <g id="medallion">
    <circle cx="250" cy="185" r="66" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
    <circle cx="250" cy="185" r="58" fill="none" stroke="url(#goldLight)" stroke-width="1.5" stroke-dasharray="4,3" />
  </g>

  <!-- Left Ornamental Scroll -->
  <g id="scroll-left" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 188,160 C 160,110 135,140 160,175 C 175,195 190,215 170,235 C 150,250 120,225 140,200 C 150,185 130,170 115,190 C 95,215 110,255 150,258 C 190,260 210,230 200,210" />
    <path d="M 184,242 C 140,246 80,255 25,248 C 65,268 120,268 185,250" fill="url(#goldGrad)" stroke="none" />
  </g>

  <!-- Right Ornamental Scroll (Mirrored) -->
  <g id="scroll-right" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 312,160 C 340,110 365,140 340,175 C 325,195 310,215 330,235 C 350,250 380,225 360,200 C 350,185 370,170 385,190 C 405,215 390,255 350,258 C 310,260 290,230 300,210" />
    <path d="M 316,242 C 360,246 420,255 475,248 C 435,268 380,268 315,250" fill="url(#goldGrad)" stroke="none" />
  </g>

  <!-- Calligraphy: علوان -->
  <g id="calligraphy-elwan" fill="url(#goldGrad)">
    <!-- Stylized Arabic Calligraphic Name 'علوان' -->
    <path d="M 235,152 C 242,142 258,142 265,152 C 270,160 262,172 250,172 C 238,172 230,160 235,152 Z" />
    <!-- Letter Ayn (ع) & Lam (ل) Loop -->
    <path d="M 226,170 C 220,150 240,135 255,140 C 270,145 272,165 260,175 C 245,185 235,178 226,170 Z M 256,150 C 248,148 238,155 242,164 C 246,170 256,168 258,160 C 260,154 258,150 256,150 Z" />
    <!-- Main Upright Stroke (L / Alif) -->
    <path d="M 265,130 Q 268,165 266,200 Q 264,208 274,208 C 285,208 288,198 288,185 C 288,150 278,135 272,125 C 282,128 296,150 296,185 C 296,215 275,220 260,218 C 248,216 242,205 245,195 L 248,175 C 240,185 230,192 220,190 C 205,188 202,170 215,160 C 228,150 238,162 245,170 Z" />
    <!-- Waw (و) Loop & Tail -->
    <path d="M 232,185 C 232,175 220,172 214,180 C 208,188 212,198 220,200 C 228,202 235,194 232,185 Z M 218,198 C 210,208 198,220 185,225 C 195,222 208,214 216,204 Z" />
    <!-- Noon (ن) Arc and Dot -->
    <path d="M 276,192 C 280,215 255,228 235,226 C 215,224 205,212 208,205 C 210,198 218,202 225,208 C 238,218 260,218 268,200 C 272,192 275,188 276,192 Z" />
    <circle cx="246" cy="204" r="3.5" />
    <!-- Accent Marks / Tashkeel -->
    <path d="M 238,132 L 244,124 L 248,126 L 242,134 Z" />
    <path d="M 268,142 Q 272,136 276,142" stroke="url(#goldGrad)" stroke-width="2" fill="none" />
  </g>

  <!-- Slogan Below: للمذاق عنوان -->
  <text x="250" y="305" font-family="'Cairo', 'Traditional Arabic', serif" font-size="28" font-weight="700" fill="url(#goldLight)" text-anchor="middle" letter-spacing="3">
    للمذاق عنوان
  </text>
  <text x="250" y="332" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#AA7C11" text-anchor="middle" letter-spacing="4">
    ELWAN RESTAURANT &amp; CAFE
  </text>
</svg>